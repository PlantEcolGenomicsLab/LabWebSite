{{ define "main" }}
<header class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="tagline">{{ . }}</p>{{ end }}
  </div>
</header>
<main class="wrap">
  {{ with .Content }}<div class="prose page-body">{{ . }}</div>{{ end }}
  <ul class="plain-list">
    {{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
  </ul>
</main>
{{ end }}
