{{ $p := .Site.Params }}
<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <p class="footer-name">{{ .Site.Title }}</p>
      <p><a href="{{ $p.institution_url }}">{{ $p.institution }}</a></p>
      <p>{{ $p.location }}</p>
    </div>
    <div>
      <p class="footer-head">Contact</p>
      {{ with $p.email }}<p><a href="mailto:{{ . }}">{{ . }}</a></p>{{ end }}
      {{ with $p.github }}<p><a href="{{ . }}">GitHub</a></p>{{ end }}
    </div>
    <div>
      <p class="footer-head">Explore</p>
      {{ range .Site.Menus.main }}<p><a href="{{ .URL }}">{{ .Name }}</a></p>{{ end }}
    </div>
  </div>
  <p class="wrap footer-copy">© {{ now.Year }} {{ .Site.Title }}</p>
</footer>
