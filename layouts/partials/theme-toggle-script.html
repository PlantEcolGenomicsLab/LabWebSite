<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector('.theme-toggle');
    var media = window.matchMedia('(prefers-color-scheme: dark)');
    function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
    function sync() {
      var label = root.classList.contains('is-dark') ? 'Switch to light mode' : 'Switch to dark mode';
      btn.setAttribute('aria-label', label); btn.title = label;
    }
    btn.addEventListener('click', function () {
      var next = root.classList.contains('is-dark') ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      root.classList.toggle('is-dark', next === 'dark');
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    media.addEventListener('change', function (e) {
      if (!saved()) { root.classList.toggle('is-dark', e.matches); sync(); }
    });
    sync();

    // Mobile menu
    var menuBtn = document.querySelector('.menu-toggle');
    var menu = document.getElementById('site-menu');
    menuBtn.addEventListener('click', function () {
      var open = menuBtn.getAttribute('aria-expanded') !== 'true';
      menuBtn.setAttribute('aria-expanded', open);
      menu.classList.toggle('open', open);
    });
  })();
</script>
